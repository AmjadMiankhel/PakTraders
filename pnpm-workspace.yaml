packages:
  - "apps/*"
  - "packages/*"
  - "database"

# pnpm 10 blocks lifecycle scripts by default. These packages legitimately need
# them to build native binaries / generate clients.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"
  - "sharp"
  - "esbuild"
  - "@tailwindcss/oxide"
  - "unrs-resolver"
